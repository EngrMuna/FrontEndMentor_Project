<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  
  <title>Product preview card component</title>
  
  <link rel="stylesheet" href="frontEndMentor.css"/>
  
</head>
<body>
  
  <div class="container">
    <!-- Main container -->
    <div class="imgContainer">
      <img src="/images/image-product-mobile.jpg" alt="Product Image" class="productImage" />
          </div>
  
            <div class="descriptionContainer">
    <!-- Product description container and items -->
              <div class="perfume">
                <p><small>PERFUME</small></p>
              </div>
        
                <div class="header">
                  <h2> Gabrielle Essence Eau De Parfum
                  </h2>
                </div>
        
            <div class="description">
              
              <p> A floral, solar and voluptuous interpretation composed by Olivier Polge, 
                Perfumer-Creator for the House of CHANEL.
              </p>
          </div>
          
          <div class="price">
            <span class="first">$149.99</span>
            <span><small>$169.99</small></span>
          </div>
          
  
  
        <div class="btnContainer">
          <button type="submit" class="btn"><span>&#128722;</span>
            Add to Cart
          </button>
        </div>
  
    </div>
  </div>
  
  
  

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.github.com/EngrMuna">Engr. Munachimso O. Nwosu</a>.
  </div>
  
  
</body>
</html>
